services:
  postgres:
    image: postgres:15-alpine
    container_name: netdevmon-db
    environment:
      POSTGRES_DB: netdevmon
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d netdevmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: netdevmon-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/netdevmon
    ports:
      - "8080:8080"

volumes:
  postgres_data:
