services:
  postgres:
    image: postgres:15-alpine
    container_name: netdevmon-db
    environment:
      POSTGRES_DB: netdevmon
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d netdevmon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netdevmon

  app:
    build: ./backend
    container_name: netdevmon-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/netdevmon
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/device-types > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - netdevmon

  frontend:
    build: ./frontend
    container_name: netdevmon-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - netdevmon

networks:
  netdevmon:
    driver: bridge

volumes:
  postgres_data:
